[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartsense-ai"
version = "0.1.0"
description = "SmartSense AI anomaly detection module"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn",
    "pandas",
    "sqlalchemy",
    "psycopg2-binary",
    "python-dotenv",
]

[tool.setuptools]
py-modules = ["config", "data_loader", "preprocessing", "model", "pipeline"]